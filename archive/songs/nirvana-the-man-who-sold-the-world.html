<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Songsterr Player</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --paper: #ffffff;
      --paper-rule: #e6e6e6;
      --paper-ink: #1a1a1a;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #ffb454;
      --accent-dim: #6f5320;
      --warn: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .layout {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top row puts the control panel (left) and the audio-source slot
       (right) side-by-side. Both children are 140px tall (the panel's
       natural height with a bit of slack); align-items:stretch makes
       the panel also fill the row's 140px so the two read as equal
       siblings. Video is 248×140 — 16:9 derived from the chosen height,
       function-driven (controls anchor the layout). Stacks on narrow
       screens with a default 320-wide video. */
    .top-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }
    .top-row .panel { flex: 1 1 auto; min-width: 0; min-height: 140px; }
    .top-row .yt-wrap {
      flex: 0 0 auto;
      width: 248px;
      height: 140px;
    }
    @media (max-width: 700px) {
      .top-row { flex-direction: column; }
      .top-row .panel { min-height: 0; }
      .top-row .yt-wrap {
        width: 320px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        margin: 0 auto;
      }
    }

    /* ── Control panel (dark, compact) ─────────────────────────────────── */
    .panel {
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    /* Title + artist collapsed onto one inline row. Visually subordinate
       to the transport — the score is the hero, not the metadata. The
       back link sits before the title (iOS-style top-left back nav). */
    .hdr {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
      min-width: 0;
    }
    .hdr-back {
      color: var(--muted);              /* subordinate to title/artist */
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex: 0 0 auto;
      margin-left: auto;                /* push to right edge of .hdr */
      padding: 2px 6px;
      margin-right: -6px;               /* flush with panel padding */
      border-radius: 4px;
    }
    .hdr-back:hover { color: var(--accent); background: rgba(255, 180, 84, 0.10); }
    .hdr-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      min-width: 0;
    }
    .hdr-artist {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }
    .hdr-sep { color: var(--muted); font-size: 12px; }

    /* Transport + tempo share one row. Spacer pushes tempo to the right. */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      padding: 6px 10px;
      background: #2a2e38;
      color: var(--fg);
      border: 1px solid #3a3f4d;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: #353a45; border-color: #4a4f5d; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    button.primary:hover:not(:disabled) { background: #8a6628; }

    /* Icon-only transport buttons. iOS HIG: 44pt minimum touch target. */
    .controls button.transport {
      flex: 0 0 auto;
      min-width: 44px;
      height: 44px;
      font-size: 16px;
      padding: 0 14px;
    }
    .controls button.sync {
      flex: 0 0 auto;
      height: 44px;
      font-size: 13px;
      padding: 0 14px;
    }
    .controls .spacer { flex: 1 1 auto; }
    .controls .tempo-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
    }
    .controls button.speed-btn {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .controls .speed-value {
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      min-width: 44px;
      text-align: center;
    }

    /* Inline status strip — Bar · Section · Position. The three facts a
       student actually needs while playing. Time sig and tempo are
       already on the score; position is redundant with the progress bar. */
    .meta {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .meta .meta-sep { opacity: 0.5; }
    .meta .meta-bar,
    .meta .meta-position {
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .meta .meta-marker { color: var(--accent); font-weight: 500; }

    .progress {
      margin-top: 6px;
      height: 3px;
      background: #2a2e38;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.05s linear;
    }

    /* ── Audio-source slot (320×180, 16:9) ────────────────────────────── */
    /* The slot now holds just the YT iframe + click-gate overlay. The
       picker chip lives in the controls panel instead, so the slot is
       free of overlapping UI — the video plays clean. Hidden entirely
       in Drums source (no iframe → no slot needed). */
    .yt-wrap {
      position: relative;
      /* width/height set by .top-row rules (148×140 desktop, fluid mobile) */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .yt-wrap[hidden] { display: none; }
    .yt-wrap iframe,
    .yt-wrap #yt {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Transparent gate over the iframe BEFORE the user has pressed Play.
       Tapping the YT area should act exactly like tapping the top Play
       button — never start YouTube via YT's own click-to-play, which
       would bypass our transport state. Once Play is pressed the overlay
       hides, exposing the iframe so the student can tap "Skip Ad" during
       prerolls. Stop puts the overlay back. */
    .yt-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      transition: background 0.1s;
    }
    .yt-overlay:hover { background: rgba(0,0,0,0.45); }
    .yt-overlay[hidden] { display: none; }

    /* Source picker chip — sits in the controls panel next to the
       transport buttons. Labeled with the current source so it doubles
       as a status display. 44pt height matches the transport buttons. */
    .src-picker-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .src-picker-wrap[hidden] { display: none; }
    .src-picker-btn {
      height: 44px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #2a2e38;
      color: var(--fg);
      border: 1px solid #3a3f4d;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }
    .src-picker-btn:hover:not(:disabled) { background: #353a45; border-color: #4a4f5d; }
    .src-picker-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .src-picker-caret { font-size: 11px; opacity: 0.7; }

    .src-picker-menu {
      position: absolute;
      top: 50px;                           /* below the 44pt button + 6px gap */
      left: 0;
      z-index: 50;
      background: var(--panel);
      border: 1px solid #3a3f4d;
      border-radius: 8px;
      min-width: 160px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .src-picker-menu[hidden] { display: none; }
    .src-picker-row {
      background: transparent;
      color: var(--fg);
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      min-height: 44px;                    /* iOS HIG touch target */
    }
    .src-picker-row:hover:not(:disabled) { background: #2a2e38; }
    .src-picker-row.is-selected {
      color: var(--accent);
      font-weight: 600;
    }
    .src-picker-row.is-selected::before {
      content: '\2713\00a0';               /* ✓ + nbsp */
    }

    /* ── Sheet music panel (light "paper") ────────────────────────────── */
    .sheet {
      background: var(--paper);
      color: var(--paper-ink);
      border-radius: 12px;
      padding: 24px 28px 20px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      min-height: 240px;
      position: relative;
    }
    .sheet-status {
      color: #777;
      font-size: 14px;
      text-align: center;
      padding: 80px 0;
    }
    /* Page-flip mode: only the page tagged .is-current is visible.
       Cursor crossings flip the class (player.js showPage). */
    .sheet-page {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      display: none;
    }
    .sheet-page.is-current { display: block; }
    .sheet-page svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* Pager (‹ 1/4 ›) for manual flips between sessions or when paused.
       Footer of the sheet panel, centered — same position a real page
       turner looks for the page-turn cue. iOS HIG-sized buttons (44pt)
       would crowd the score corner; below the music they're out of the
       way and within easy reach. */
    .pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--paper-rule);
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 13px;
      color: #888;
      user-select: none;
    }
    .pager[hidden] { display: none; }
    .pager button.pager-btn {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      background: #f7f7f7;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
    }
    .pager button.pager-btn:hover:not(:disabled) {
      background: #ececec;
      color: #222;
    }
    .pager button.pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pager-label { min-width: 48px; text-align: center; }

    /* ── Footer / errors ──────────────────────────────────────────────── */
    .footer {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }
    .error {
      color: var(--warn);
      font-size: 13px;
      text-align: center;
    }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <div class="layout">

    <!-- Top row: controls panel on the left, YT slot on the right.
         Stacks on narrow screens (see .top-row media query). -->
    <div class="top-row">

      <!-- Controls (dark, compact) -->
      <div class="panel">
        <div class="hdr">
          <span class="hdr-title" id="title">Loading…</span>
          <span class="hdr-sep" aria-hidden="true">·</span>
          <span class="hdr-artist" id="artist">&nbsp;</span>
          <a href="../index.html" class="hdr-back" aria-label="All songs">&larr; All songs</a>
        </div>

        <div class="controls">
          <!-- Single transport button. Label adapts to state:
                 IDLE     ▶          tap → start (YT preroll or sampled drums)
                 PRESYNC  ▶ Sync     tap → sync cursor to YT now (ad just ended)
                 PLAYING  ⏸          tap → pause
                 PAUSED   ▶          tap → resume (re-sync to YT if YT mode) -->
          <button id="btn-playpause" class="primary transport" disabled aria-label="Play">▶</button>
          <button id="btn-stop" class="transport" disabled aria-label="Stop">⏹</button>

          <!-- Source picker chip. Sits next to the transport buttons so
               it reads as "what's being played." Hidden when the song has
               no YT video (Drums is the only available source). -->
          <span class="src-picker-wrap" id="src-picker-wrap" hidden>
            <button id="src-picker-btn" class="src-picker-btn" type="button"
                    aria-haspopup="menu" aria-label="Audio source">
              <span id="src-picker-label">Original</span>
              <span class="src-picker-caret" aria-hidden="true">&#x25BE;</span>
            </button>
            <div id="src-picker-menu" class="src-picker-menu" role="menu" hidden></div>
          </span>

          <span class="spacer"></span>

          <div class="tempo-group" aria-label="Practice tempo">
            <button id="btn-tempo-down" class="speed-btn"
                    title="Slower (↓)" aria-label="Decrease tempo">−</button>
            <span class="speed-value" id="tempo-value">100%</span>
            <button id="btn-tempo-up" class="speed-btn"
                    title="Faster (↑)" aria-label="Increase tempo">+</button>
          </div>
        </div>

        <div class="meta">
          <span class="meta-bar" id="status-bar">—</span>
          <span class="meta-sep">·</span>
          <span class="meta-marker" id="status-marker">—</span>
          <span class="meta-sep">·</span>
          <span class="meta-position" id="status-position">0:00 / 0:00</span>
        </div>

        <div class="progress">
          <div class="progress-fill" id="progress"></div>
        </div>

      </div>

      <!-- Audio-source slot — YT iframe + click-gate overlay. Hidden when
           Drums is the current source (iframe destroyed, panel takes the
           recovered horizontal space). -->
      <div class="yt-wrap" id="yt-wrap" hidden>
        <div id="yt"></div>
        <div id="yt-overlay" class="yt-overlay"
             role="button" tabindex="0" aria-label="Start playback">▶ Tap Play to start</div>
      </div>

    </div>

    <!-- Sheet music (light) — one page at a time. -->
    <div class="sheet" id="sheet">
      <div class="sheet-status" id="sheet-status">Loading sheet music…</div>
      <div class="pager" id="pager" hidden>
        <button id="btn-page-prev" class="pager-btn" aria-label="Previous page">‹</button>
        <span class="pager-label" id="pager-label">1 / 1</span>
        <button id="btn-page-next" class="pager-btn" aria-label="Next page">›</button>
      </div>
    </div>

    <div class="footer">
      Drum samples from Virtuosity Drums (CC0). Sheet music engraved by LilyPond.
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
// player.js — fetch the schedule, set up Tone.js synths, drive playback,
// fetch and inline LilyPond-rendered SVG pages, drive the UI.
//
// All audio timing comes from Tone.Transport; all UI state is derived from
// Tone.Transport.seconds in a requestAnimationFrame loop. Scheduling is
// done once, when the user first hits Play (Tone.start() requires a user
// gesture for the AudioContext).
//
// Sheet music: SVG pages are fetched as text and inlined into the DOM so
// (a) they style cleanly under our CSS, and (b) Milestone 6e can attach
// click/highlight behaviour to individual <g class="NoteHead"> elements.

'use strict';

// ── Globals ──────────────────────────────────────────────────────────────────

let SCHEDULE = null;          // the dict returned by /api/score
let PLAYERS = null;           // Tone.Players instance built during init()
let MASTER_VOL = null;        // Tone.Volume between PLAYERS and destination

// Drum master gain in dB. Drums are only audible in DRUMS source (no YT
// alongside to fight); -6 dB gives headroom against 9-voice peaks (kick +
// snare + hats + crashes can stack).
const DRUMS_DB = -6;
let SAMPLES_LOADED = false;   // true once Tone.Players has fetched every buffer
let SCHEDULED = false;        // have we already pushed events to Transport?
let RAF_ID = null;            // animation frame handle for UI loop
let TEMPO_INDEX = 0;          // hint for sequential tempo lookup during play
let MEASURE_INDEX = 0;        // ditto for measures
let EVENT_INDEX = -1;         // active schedule event for cursor highlighting
                              // (-1 = before any event has fired)
let POS_TO_NODES = null;      // Map<position_string, Element[]>, built once
                              // sheet music is inlined into the DOM
let POS_TO_PAGE = null;       // Map<position_string, page_index>
let EVENT_TO_PAGE = null;     // Array<page_index>, parallel to SCHEDULE.events.
                              // Filled by inheriting the previous event's page
                              // when an event's position has no notehead (e.g.
                              // grace v8 acciaccatura tucked into the next note).
let CURRENT_PAGE = 0;         // page currently rendered with .is-current
let TOTAL_PAGES = 0;          // set when SVGs are inlined

// ── YouTube sync state (Milestone 6g) ────────────────────────────────────────
// When SCHEDULE.youtube_id is set, an embedded YT.Player slaves to the
// Tone.Transport clock. Tone.js is master because its sample-accurate
// AudioContext clock has sub-millisecond precision; YT.getCurrentTime
// quantises to ~250 ms and isn't usable as a master. The slave is kept
// in lockstep by:
//   - calling YT.setPlaybackRate when our tempo factor changes
//   - polling drift every ~500 ms wall and seeking YT back if it strays
let YT_PLAYER = null;         // YT.Player instance (or null when no video)
let YT_READY = false;         // YT IFrame API said onReady fired
let YT_BUFFERING = false;     // skip drift correction while buffering
let LAST_YT_DRIFT_CHECK_WALL = 0;   // wall seconds at last drift check
const YT_DRIFT_CHECK_INTERVAL_SEC = 0.5;
const YT_DRIFT_THRESHOLD_SEC = 0.15;   // tighter would oscillate against
                                        // YT's own ~250 ms quantum

// Static deployment (build_static.py) lives at /songs/<slug>.html and
// reaches samples via ../samples/. Dev server (player.py) serves the page
// at / and samples at /samples/. The mode flag we use everywhere else is
// the presence of window.SONGSTERR_SCHEDULE — reuse it here.
const SAMPLES_BASE = window.SONGSTERR_SCHEDULE ? '../samples/' : '/samples/';

// Tempo (practice-speed) state. The schedule is built in musical seconds —
// independent of any user-controlled factor. The factor is applied at
// scheduling time: each event's wall-clock target is
//   wallNow + (event.musical_t - currentMusicalTime) / factor
// so that already-played time is preserved exactly when the factor changes.
// (Tone.Part's own playbackRate setter rebuilds child startTicks from
// Transport tick 0, treating the part as if it were restarting at the new
// rate; for mid-playback changes this drags the elapsed prefix into the
// new rate too. We schedule via Transport.schedule directly to avoid that.)
//
// The cursor reads MUSICAL_TIME, an integral of (wall-clock dt × current
// factor), so mid-playback factor changes stay coherent with audio.
//
// We do NOT touch Tone.Transport.bpm: it would stretch each sample's
// playback duration too, slowing the drum hit itself instead of just the
// gap between hits. We want SPACING to stretch, not the hits.
let TEMPO_FACTOR = 1.0;       // 0.05 .. 1.0, in 0.05 steps
let MUSICAL_TIME = 0;         // accumulated musical seconds played
let LAST_PERF_TIME = 0;       // last performance.now() sample for the cursor
                              // accumulator. We deliberately do NOT read
                              // Tone.Transport.seconds — on iPad with drums
                              // muted (the YT-attached case), the AudioContext
                              // can suspend for power-saving and Transport.seconds
                              // stops advancing, freezing the cursor. The
                              // cursor doesn't need audio-accurate timing, only
                              // a wall clock × tempo factor.
let IS_PLAYING = false;       // mirrors onPlay/onPause/onStop. Used in place
                              // of Tone.Transport.state for the same reason as
                              // LAST_PERF_TIME above.

const TEMPO_MIN = 0.05;
const TEMPO_MAX = 1.0;
const TEMPO_STEP = 0.05;

// Tempo grids by source. In YT sources (Song, Backing) the cursor slaves
// to YT, and YT only supports 0.25/0.5/0.75/1.0 inside our slow-down
// window. In DRUMS source there's no YT, so full 5% granularity.
const TEMPO_GRID_FINE = (() => {
  const g = [];
  for (let f = TEMPO_MIN; f <= TEMPO_MAX + 1e-9; f += TEMPO_STEP) {
    g.push(Math.round(f * 100) / 100);
  }
  return g;
})();
const TEMPO_GRID_YT = [0.25, 0.50, 0.75, 1.00];

function activeTempoGrid() {
  return ytNeeded() ? TEMPO_GRID_YT : TEMPO_GRID_FINE;
}

const GRACE_V8_OFFSET_SECONDS = 0.030;  // play v8 acciaccaturas 30ms early

// ── Audio source ─────────────────────────────────────────────────────────────
// Single dimension covering both the old "mode" and the YT video pick.
// Drums and YT never coexist — that's what makes the sync question moot.
//   SONG    — YT full mix, drums muted. Default when YT is available.
//   BACKING — YT backing track, drums muted. Shown only when a backing
//             candidate exists for this song's drums part.
//   DRUMS   — sampled drums, YT iframe destroyed (not just muted — see
//             ios-audiocontext-suspend gotcha).
// When SCHEDULE.youtube_id is null the picker doesn't render and behaviour
// is effectively DRUMS.
const SOURCE = Object.freeze({
  SONG: 'song',
  BACKING: 'backing',
  DRUMS: 'drums',
});
let CURRENT_SOURCE = SOURCE.DRUMS;  // set definitively in init()

// Predicates derived from CURRENT_SOURCE — single source of truth for the
// scattered checks that used to be "if (SCHEDULE.youtube_id)" or per-
// checkbox-checked reads.
function ytNeeded()     { return CURRENT_SOURCE !== SOURCE.DRUMS; }
function drumsAudible() { return CURRENT_SOURCE === SOURCE.DRUMS; }
function ytAudible()    { return CURRENT_SOURCE !== SOURCE.DRUMS; }

// localStorage key — per-pathname so each deployed song remembers its own
// last-used source. Falls back gracefully if storage is denied.
const STORAGE_KEY_SOURCE = `songsterr.source:${location.pathname}`;

// ── DOM handles ──────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const elTitle = $('title');
const elArtist = $('artist');
const elBtnPlayPause = $('btn-playpause');  // smart toggle, see playerState()
const elBtnStop = $('btn-stop');
const elBar = $('status-bar');
const elMarker = $('status-marker');
const elPosition = $('status-position');
const elProgress = $('progress');
const elError = $('error');
const elSheet = $('sheet');
const elSheetStatus = $('sheet-status');
const elBtnTempoDown = $('btn-tempo-down');
const elBtnTempoUp = $('btn-tempo-up');
const elTempoValue = $('tempo-value');
const elYtWrap = $('yt-wrap');
const elYtOverlay = $('yt-overlay');
const elSrcPickerWrap = $('src-picker-wrap');
const elSrcPickerBtn = $('src-picker-btn');
const elSrcPickerMenu = $('src-picker-menu');
const elPager = $('pager');
const elPagerLabel = $('pager-label');
const elBtnPagePrev = $('btn-page-prev');
const elBtnPageNext = $('btn-page-next');

// Has the user committed to playback this session? True from the first
// Start sync click until Stop. Pause does NOT unlock — to change picker,
// mode, or speed, the user must hit Stop and re-stage. Keeps the UX
// predictable: settings can only change between sessions, not mid-song.
let SETTINGS_LOCKED = false;

// ── Bootstrap ────────────────────────────────────────────────────────────────

async function init() {
  try {
    if (window.SONGSTERR_SCHEDULE) {
      // Static-deployment mode (build_static.py): the schedule is embedded
      // in the page as a window global. Skip the fetch.
      SCHEDULE = window.SONGSTERR_SCHEDULE;
    } else {
      const resp = await fetch('/api/score');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      SCHEDULE = await resp.json();
    }
  } catch (err) {
    showError(`Failed to load score: ${err.message}`);
    return;
  }

  elTitle.textContent = SCHEDULE.title || '(untitled)';
  elArtist.textContent = SCHEDULE.artist || '';
  elBar.textContent = `Bar 1 / ${SCHEDULE.measures.length}`;
  elPosition.textContent = `0:00 / ${formatTime(SCHEDULE.total_seconds)}`;

  elBtnPlayPause.addEventListener('click', onPlayPauseToggle);
  elBtnStop.addEventListener('click', onStop);
  // Overlay routes any tap on the YT thumbnail through the same Play
  // logic — YouTube's own click-to-play would bypass our transport
  // state and confuse the cursor's "Sync" expectation. Enter activates
  // it for keyboard users too.
  if (elYtOverlay) {
    elYtOverlay.addEventListener('click', onPlayPauseToggle);
    elYtOverlay.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        onPlayPauseToggle();
      }
    });
  }
  elBtnTempoDown.addEventListener('click', onTempoDown);
  elBtnTempoUp.addEventListener('click', onTempoUp);
  elBtnPagePrev.addEventListener('click', () => showPage(CURRENT_PAGE - 1));
  elBtnPageNext.addEventListener('click', () => showPage(CURRENT_PAGE + 1));
  window.addEventListener('keydown', onKeyDown);
  updateTempoUi();

  // Audio source picker: only render when the schedule names a video AND
  // we have at least one YT candidate. Last-used source is restored from
  // localStorage; defaults to Original (full mix) when available.
  if (SCHEDULE.youtube_id) {
    CURRENT_SOURCE = defaultSource();
    const initialCand = candidateForSource(CURRENT_SOURCE);
    if (initialCand) applyCandidateToSchedule(initialCand);
    if (elSrcPickerWrap) elSrcPickerWrap.hidden = false;
    buildSourceMenu();
    if (elSrcPickerBtn) {
      elSrcPickerBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        toggleSourceMenu();
      });
    }
    refreshSourcePickerUi();
    // Only spin up the YT IFrame when the initial source actually needs it.
    // If the user last chose DRUMS, no iframe loads on this visit.
    if (CURRENT_SOURCE !== SOURCE.DRUMS) initYouTube();
  }
  refreshYtOverlay();
  // else: CURRENT_SOURCE stays DRUMS, picker stays hidden, the page behaves
  // identically to a pre-6g player (drums only).

  // Kick off sample loading immediately. buildPlayers() arms an onload
  // callback that enables the transport. While loading, the play button
  // stays disabled (no need for a text label since it's icon-only).
  PLAYERS = buildPlayers();

  // Sheet music is not on the audio critical path; load it in parallel and
  // let the user start playing as soon as the schedule and samples are up.
  loadSheetMusic(SCHEDULE.svg_pages || 0);
}

function maybeEnablePlay() {
  // Drums must be loaded IFF they'll be heard. YT must be ready IFF the
  // current mode needs it. Sampled-drums-only mode can start as soon as
  // samples load even though we never created the YT iframe.
  if (!SCHEDULE) return;
  if (drumsAudible() && !SAMPLES_LOADED) return;
  if (ytNeeded() && !YT_READY) return;
  elBtnPlayPause.disabled = false;
}

// ── Sheet music ──────────────────────────────────────────────────────────────

async function loadSheetMusic(pageCount) {
  if (pageCount <= 0) {
    elSheetStatus.textContent =
      'Sheet music not available (LilyPond compilation skipped or failed).';
    return;
  }

  // Fetch all pages in parallel — they're independent, and most scores
  // are 1–4 pages so the total payload is small.
  let texts;
  try {
    if (Array.isArray(window.SONGSTERR_SVGS)) {
      // Static-deployment mode (build_static.py): the SVG strings are
      // embedded in the page as a window global. Skip the fetches.
      texts = window.SONGSTERR_SVGS;
    } else {
      const responses = await Promise.all(
        Array.from({ length: pageCount }, (_, i) =>
          fetch(`/svg/${i}`).then(r => {
            if (!r.ok) throw new Error(`page ${i}: HTTP ${r.status}`);
            return r.text();
          })
        )
      );
      texts = responses;
    }
  } catch (err) {
    elSheetStatus.textContent = `Failed to load sheet music: ${err.message}`;
    return;
  }

  // Replace the loading placeholder with the inlined SVG pages. The
  // pager UI lives inside .sheet as well, so re-append it after the
  // innerHTML wipe.
  elSheet.innerHTML = '';
  for (let i = 0; i < texts.length; i++) {
    const wrapper = document.createElement('div');
    wrapper.className = 'sheet-page';
    wrapper.dataset.pageIndex = String(i);
    // innerHTML on an SVG string is the simplest way to get it into the DOM
    // as proper SVG nodes (rather than escaped text). The browser parses
    // the <svg> root and creates the element tree.
    wrapper.innerHTML = texts[i];
    if (i === 0) wrapper.classList.add('is-current');
    elSheet.appendChild(wrapper);
  }
  elSheet.appendChild(elPager);

  TOTAL_PAGES = texts.length;
  CURRENT_PAGE = 0;
  elPager.hidden = TOTAL_PAGES <= 1;
  updatePagerUi();

  buildPositionIndex();
  buildEventToPageMap();
  injectCursorCss();
}

// ── Pagination ───────────────────────────────────────────────────────────────
// One sheet-page is .is-current at a time. The cursor flips pages when an
// event crosses into a new page (see updateCursor); the pager lets the
// student peek ahead or back manually between sessions / when paused.

function showPage(idx) {
  if (!Number.isFinite(idx)) return;
  if (idx < 0 || idx >= TOTAL_PAGES) return;
  if (idx === CURRENT_PAGE) return;
  const pages = elSheet.querySelectorAll('.sheet-page');
  pages.forEach((p, i) => p.classList.toggle('is-current', i === idx));
  CURRENT_PAGE = idx;
  updatePagerUi();
}

function updatePagerUi() {
  if (!elPagerLabel) return;
  elPagerLabel.textContent = `${CURRENT_PAGE + 1} / ${TOTAL_PAGES}`;
  elBtnPagePrev.disabled = CURRENT_PAGE <= 0;
  elBtnPageNext.disabled = CURRENT_PAGE >= TOTAL_PAGES - 1;
}

function buildEventToPageMap() {
  // Some events have no notehead at their data-pos (notably grace v8
  // acciaccaturas that share a position with the on-beat note next to
  // them). For those we inherit the previous event's page so the cursor
  // never tries to "flip to nowhere".
  if (!SCHEDULE || !SCHEDULE.events) { EVENT_TO_PAGE = []; return; }
  EVENT_TO_PAGE = new Array(SCHEDULE.events.length);
  let lastPage = 0;
  for (let i = 0; i < SCHEDULE.events.length; i++) {
    const pos = SCHEDULE.events[i].position;
    if (POS_TO_PAGE && POS_TO_PAGE.has(pos)) {
      lastPage = POS_TO_PAGE.get(pos);
    }
    EVENT_TO_PAGE[i] = lastPage;
  }
}

// ── Playback cursor ──────────────────────────────────────────────────────────

function buildPositionIndex() {
  // The emitter tags each notehead's parent <g> with class="note" (or
  // "grace") and data-pos="<num>/<den>". Index those groups by data-pos
  // so the cursor can flip a CSS class on every notehead at a given
  // position in O(1). Multiple noteheads at one position is normal —
  // chords, v5 flam (grace + main), v8 acciaccatura (grace + main note).
  //
  // We also build POS_TO_PAGE so updateCursor knows which page to flip
  // to when a position becomes active. Walk pages in order so the first
  // occurrence of any data-pos wins.
  POS_TO_NODES = new Map();
  POS_TO_PAGE = new Map();
  const pages = elSheet.querySelectorAll('.sheet-page');
  let totalNoteheads = 0;
  pages.forEach((page, idx) => {
    const groups = page.querySelectorAll('g[data-pos]');
    totalNoteheads += groups.length;
    for (const g of groups) {
      const pos = g.getAttribute('data-pos');
      if (!POS_TO_NODES.has(pos)) POS_TO_NODES.set(pos, []);
      POS_TO_NODES.get(pos).push(g);
      if (!POS_TO_PAGE.has(pos)) POS_TO_PAGE.set(pos, idx);
    }
  });
  console.log(
    `Cursor index: ${totalNoteheads} noteheads at ${POS_TO_NODES.size} positions across ${pages.length} page(s)`
  );
}

function injectCursorCss() {
  // LilyPond's SVG noteheads are <path fill="currentColor"/> inside the
  // tagged <g>. Setting `color` on the ancestor cascades into the path
  // via currentColor — DO NOT use `fill`, which would have no effect
  // unless we also overrode the path's own fill attribute.
  const style = document.createElement('style');
  style.id = 'cursor-css';
  style.textContent = `
    .sheet-page g.note.active  { color: #d33; }
    .sheet-page g.grace.active { color: #f80; }
  `;
  document.head.appendChild(style);
}

function findCurrentEventIndex(t) {
  // Latest i such that events[i].seconds <= t, or -1 if t precedes all.
  // Sequential, with backward-walk on rewind/stop. Cheap regardless of
  // direction since playback usually moves forward.
  if (!SCHEDULE || !SCHEDULE.events.length) return -1;
  let i = EVENT_INDEX;
  while (i >= 0 && SCHEDULE.events[i].seconds > t) i--;
  while (i + 1 < SCHEDULE.events.length &&
         SCHEDULE.events[i + 1].seconds <= t) i++;
  return i;
}

function clearCursor() {
  if (!POS_TO_NODES) return;
  for (const nodes of POS_TO_NODES.values()) {
    for (const n of nodes) n.classList.remove('active');
  }
}

function updateCursor(t) {
  if (!POS_TO_NODES) return;  // sheet music not loaded yet
  const newIndex = findCurrentEventIndex(t);
  if (newIndex === EVENT_INDEX) return;  // common case: no DOM work

  const oldPos = EVENT_INDEX >= 0
    ? SCHEDULE.events[EVENT_INDEX].position : null;
  const newPos = newIndex >= 0
    ? SCHEDULE.events[newIndex].position : null;

  // Same-position transitions (v8 acciaccatura grace -> on-beat note,
  // both at the same IR position) advance the index without re-toggling
  // classes — avoids a perceptible blink on shared noteheads.
  if (oldPos === newPos) {
    EVENT_INDEX = newIndex;
    return;
  }

  if (oldPos !== null) {
    const oldNodes = POS_TO_NODES.get(oldPos);
    if (oldNodes) for (const n of oldNodes) n.classList.remove('active');
  }
  if (newPos !== null) {
    const newNodes = POS_TO_NODES.get(newPos);
    if (newNodes) for (const n of newNodes) n.classList.add('active');
    if (EVENT_INDEX < 0 && newIndex >= 0) {
      // First highlight — useful to confirm in devtools that the cursor
      // is actually firing class toggles on the right node count.
      console.log(`[player] cursor first hit at pos=${newPos}, `
        + `nodes=${newNodes ? newNodes.length : 0}`);
    }
  }
  EVENT_INDEX = newIndex;

  // Auto-flip page. Two cases:
  //   1. The cursor's current event is the LAST event on its page, AND
  //      the next event lives on a later page. Flip *now* so the
  //      student sees what's coming while they're still playing the
  //      final beat. Same principle as a human page-turner: flip on
  //      the last bar, not after it.
  //   2. Otherwise, just snap to the page containing the active event.
  //      Covers rewinds and manual page changes that the cursor then
  //      catches up with.
  // The brief moment between "last event of page P" and "first event
  // of page P+1" leaves no notehead highlighted — that's fine. The
  // student already played the last beat of page P; they need to see
  // page P+1 next.
  if (newIndex >= 0 && EVENT_TO_PAGE) {
    const eventPage = EVENT_TO_PAGE[newIndex];
    const nextIdx = newIndex + 1;
    const isLastOfPage = nextIdx < EVENT_TO_PAGE.length
                      && EVENT_TO_PAGE[nextIdx] > eventPage;
    const targetPage = isLastOfPage ? EVENT_TO_PAGE[nextIdx] : eventPage;
    if (targetPage !== CURRENT_PAGE) showPage(targetPage);
  }
}

// ── Sample playback (Tone.Players) ───────────────────────────────────────────

function buildPlayers() {
  // Single Tone.Players bank, one buffer per drum voice.
  //
  // We wait on Tone.loaded() rather than passing onload to the constructor:
  // the (urls, onload) form is flaky in Tone.js 14.8.x (onload doesn't
  // reliably fire if any buffer is cached or completes synchronously).
  // Tone.loaded() returns a Promise that resolves when *every* tracked
  // ToneAudioBuffer is decoded — works regardless of cache state.
  MASTER_VOL = new Tone.Volume(DRUMS_DB).toDestination();
  // Drums are only audible in the DRUMS source. In Song/Backing the YT
  // recording carries the audio and a physical kit (or just listening)
  // covers the drums — sampled drums stay muted.
  MASTER_VOL.mute = !drumsAudible();
  const masterVol = MASTER_VOL;
  const urls = {
    kick:       `${SAMPLES_BASE}kick.mp3`,
    snare:      `${SAMPLES_BASE}snare.mp3`,
    sidestick:  `${SAMPLES_BASE}sidestick.mp3`,
    tom_high:   `${SAMPLES_BASE}tom_high.mp3`,
    tom_low:    `${SAMPLES_BASE}tom_low.mp3`,
    hat_closed: `${SAMPLES_BASE}hat_closed.mp3`,
    hat_open:   `${SAMPLES_BASE}hat_open.mp3`,
    crash:      `${SAMPLES_BASE}crash.mp3`,
    ride:       `${SAMPLES_BASE}ride.mp3`,
  };
  console.log(`Loading drum samples from ${SAMPLES_BASE}…`);
  const players = new Tone.Players(urls).connect(masterVol);

  // Per-voice trim, in dB. crash sits too hot at unity; kick needs a push
  // to cut through the mix.
  players.player('crash').volume.value = -4;
  players.player('kick').volume.value  = +8;

  Tone.loaded().then(() => {
    console.log('Drum samples loaded.');
    SAMPLES_LOADED = true;
    maybeEnablePlay();
  }).catch(err => {
    showError(`Failed to load drum samples: ${err.message}`);
  });

  return players;
}

function dispatch(midi) {
  // Returns the voice name (key into PLAYERS). Drum samples are not pitched,
  // so unlike the previous synth bank we don't need a 'note' field.
  // 9 voices total; see samples/CREDITS.md for the MIDI→voice mapping.
  switch (midi) {
    case 35: case 36:                     return 'kick';
    case 37:                              return 'sidestick';
    case 38: case 39: case 40:            return 'snare';
    case 41: case 43: case 45: case 47:   return 'tom_low';
    case 48: case 50:                     return 'tom_high';
    case 42: case 44:                     return 'hat_closed';
    case 46: case 92:                     return 'hat_open';
    case 49: case 52: case 55: case 57: case 59:
                                          return 'crash';
    case 51: case 53:                     return 'ride';
    default:                              return 'snare';
  }
}

function playDrum(midi, time) {
  // Each call restarts the named player. Tone.Player is monophonic per
  // instance — rapid retriggers cut the previous hit. That matches the old
  // synth behaviour and is fine for snare/kick/hat; for crash/ride a
  // long-decay overlap would be more authentic (deferred to a future
  // milestone).
  PLAYERS.player(dispatch(midi)).start(time);
}

// ── Scheduling ───────────────────────────────────────────────────────────────

function rebuildAudioSchedule(currentMusicalTime, factor) {
  // Re-push every still-future event (musical_t > currentMusicalTime) onto
  // Transport at its target wall-clock time:
  //
  //   target_wall = wallNow + (event.musical_t - currentMusicalTime) / factor
  //
  // We tried Tone.Part with PART.playbackRate = factor, but the setter
  // calls _rescheduleEvents() which recomputes each child's startTick as
  // child.startOffset / playbackRate from Transport tick 0 — i.e. it
  // assumes the Part is restarting fresh at the new rate. Mid-playback
  // changes therefore drag already-elapsed time into the new rate too,
  // producing a cursor-leads-audio drift equal to the time already played.
  // Here we only reschedule the FUTURE, so the elapsed prefix stays put.
  Tone.Transport.cancel();
  const wallNow = Tone.Transport.seconds;
  for (const ev of SCHEDULE.events) {
    const evT = ev.grace_v8
      ? Math.max(0, ev.seconds - GRACE_V8_OFFSET_SECONDS)
      : ev.seconds;
    if (evT <= currentMusicalTime) continue;
    const targetWall = wallNow + (evT - currentMusicalTime) / factor;
    const midiList = ev.midi;
    Tone.Transport.schedule((audioTime) => {
      for (const m of midiList) playDrum(m, audioTime);
    }, targetWall);
  }
}

function scheduleAll() {
  // First-time scheduling at start of playback. MUSICAL_TIME is 0 (just
  // baselined in onPlay → startUiLoop), so this is equivalent to scheduling
  // every event at its musical time / factor. End-of-playback is detected
  // in updateUi() via MUSICAL_TIME — not via a Transport.schedule callback,
  // because that fires by wall-clock and wouldn't honour the factor.
  rebuildAudioSchedule(0, TEMPO_FACTOR);
  SCHEDULED = true;
}

// ── Controls ─────────────────────────────────────────────────────────────────
//
// The transport is a 4-state FSM:
//
//   IDLE        nothing started; tap ▶ starts YT (or sampled drums)
//   PRESYNC     YT playing (preroll/ad), cursor not running;
//               tap ▶ Sync starts the cursor from YT's current time
//   PLAYING     YT + cursor + drums, all in sync; tap ⏸ pauses
//   PAUSED      session paused mid-song; tap ▶ resumes (re-syncs to YT)
//
// Sampled-only mode skips PRESYNC entirely (no ad to wait through).
// One Play button reads the state and dispatches to the right action;
// Stop remains a separate escape hatch.

const STATE = Object.freeze({
  IDLE:    'IDLE',
  PRESYNC: 'PRESYNC',
  PLAYING: 'PLAYING',
  PAUSED:  'PAUSED',
});

function playerState() {
  if (IS_PLAYING) return STATE.PLAYING;
  // !IS_PLAYING from here
  if (elBtnStop.disabled) return STATE.IDLE;
  // Session active. PRESYNC = YT started but cursor hasn't been synced
  // yet (only reachable in YT modes; SETTINGS_LOCKED flips on first Sync).
  if (ytNeeded() && !SETTINGS_LOCKED) return STATE.PRESYNC;
  return STATE.PAUSED;
}

async function onPlayPauseToggle() {
  switch (playerState()) {
    case STATE.PLAYING:
      onPause();                       // → PAUSED
      return;
    case STATE.IDLE:
      await onPlay();                  // → PRESYNC (YT) or PLAYING (sampled)
      return;
    case STATE.PRESYNC:
      await onStartMusic();            // → PLAYING (first sync)
      return;
    case STATE.PAUSED:
      if (ytNeeded() && YT_PLAYER && YT_READY) {
        YT_PLAYER.playVideo();
        await onStartMusic();          // re-sync cursor to YT's current time
      } else {
        await onPlay();                // sampled: just resume Tone.Transport
      }
      return;
  }
}

function refreshPlayPauseLabel() {
  switch (playerState()) {
    case STATE.PLAYING:
      elBtnPlayPause.textContent = '⏸';
      elBtnPlayPause.setAttribute('aria-label', 'Pause');
      elBtnPlayPause.title = 'Pause';
      return;
    case STATE.PRESYNC:
      elBtnPlayPause.textContent = '▶ Sync';
      elBtnPlayPause.setAttribute('aria-label', 'Sync cursor to song');
      elBtnPlayPause.title = 'Sync — tap when the song begins';
      return;
    case STATE.PAUSED:
      elBtnPlayPause.textContent = '▶';
      elBtnPlayPause.setAttribute('aria-label', 'Resume');
      elBtnPlayPause.title = 'Resume';
      return;
    case STATE.IDLE:
    default:
      elBtnPlayPause.textContent = '▶';
      elBtnPlayPause.setAttribute('aria-label', 'Play');
      elBtnPlayPause.title = 'Play';
      return;
  }
}

async function onPlay() {
  // YT modes: this button starts the YouTube video only. The cursor + drums
  // sit frozen at beat 1 until the user separately presses "🎵 Sync"
  // when the actual song begins (after any preroll ad — they can click
  // YouTube's Skip Ad button inside the iframe to fast-forward).
  // The YT IFrame API does not reliably expose ad presence (getDuration
  // and getVideoData both return the MAIN video's metadata during the
  // preroll), so automated detection was deleted in favour of this
  // two-button UX.
  //
  // Sampled drums mode (no YT): nothing to wait for — Play directly starts
  // the cursor + drums.
  if (ytNeeded() && YT_PLAYER && YT_READY) {
    YT_PLAYER.setPlaybackRate(TEMPO_FACTOR);
    YT_PLAYER.playVideo();
    // IDLE → PRESYNC: button label flips to "▶ Sync"; the cursor is
    // armed but waiting for the student to tap once the ad clears.
    elBtnStop.disabled = false;
    refreshPlayPauseLabel();
    refreshYtOverlay();
    return;
  }

  // IDLE → PLAYING (sampled mode skips PRESYNC entirely).
  await Tone.start();
  if (!SCHEDULED) scheduleAll();
  Tone.Transport.start();
  LAST_PERF_TIME = performance.now() / 1000;
  IS_PLAYING = true;
  startUiLoop();
  elBtnStop.disabled = false;
  refreshPlayPauseLabel();
}

async function onStartMusic() {
  // Starts (or re-syncs) the cursor + drum playback to the YT video's
  // current position. Calculation: songSeconds = max(0, YT.currentTime -
  // youtube_offset). If the user clicks before the song actually begins,
  // songSeconds clamps to 0 and the cursor sits at beat 1 until they
  // click again. Re-clicking re-syncs to whatever position YT is at now,
  // useful if the cursor drifts.
  await Tone.start();
  const ytOffset = SCHEDULE.youtube_offset || 0;
  let ytNow = 0;
  if (ytNeeded() && YT_PLAYER && YT_READY) {
    try { ytNow = YT_PLAYER.getCurrentTime() || 0; } catch (_) { ytNow = 0; }
  }
  const songSeconds = Math.max(0, ytNow - ytOffset);

  // Rebuild the Tone.Transport schedule from scratch so events at past
  // positions don't pile up if Start music was clicked multiple times.
  Tone.Transport.stop();
  Tone.Transport.cancel();
  SCHEDULED = false;
  scheduleAll();

  // Start transport at the calculated offset — Tone skips events scheduled
  // before this offset, so drums fire from songSeconds onward.
  Tone.Transport.start(undefined, songSeconds);
  MUSICAL_TIME = songSeconds;
  LAST_PERF_TIME = performance.now() / 1000;
  LAST_YT_DRIFT_CHECK_WALL = 0;  // immediate drift check on next UI tick
  IS_PLAYING = true;
  startUiLoop();
  console.log(`[player] cursor started at songSeconds=${songSeconds.toFixed(2)} (YT t=${ytNow.toFixed(2)}, offset=${ytOffset.toFixed(2)})`);
  // PRESYNC → PLAYING (or PAUSED → PLAYING in YT mode). Locking picker,
  // mode, and speed for the rest of the session — they stay locked
  // through Pause; only Stop unlocks (handled in onStop).
  SETTINGS_LOCKED = true;
  applySettingsLock();
  refreshPlayPauseLabel();
}

function onPause() {
  Tone.Transport.pause();
  IS_PLAYING = false;
  if (ytNeeded() && YT_PLAYER && YT_READY) YT_PLAYER.pauseVideo();
  refreshPlayPauseLabel();
}

function onStop({ cueYt = true } = {}) {
  // cueYt=false is used by callers that are about to cue a DIFFERENT
  // video right after (the picker swap), to avoid two cueVideoById
  // calls racing inside the iframe — the second one was dropping and
  // YT stayed on the old video.
  Tone.Transport.stop();
  Tone.Transport.position = 0;
  Tone.Transport.cancel();   // clear every pending callback
  SCHEDULED = false;
  IS_PLAYING = false;
  if (ytNeeded() && YT_PLAYER && YT_READY) {
    YT_PLAYER.pauseVideo();
    if (cueYt) {
      // Re-cue (not seek) so YT sits paused at offset without auto-playing.
      try {
        YT_PLAYER.cueVideoById({
          videoId: SCHEDULE.youtube_id,
          startSeconds: SCHEDULE.youtube_offset || 0,
        });
      } catch (_) { /* harmless */ }
    }
  }
  elBtnPlayPause.disabled = false;
  elBtnStop.disabled = true;
  // PAUSED/PLAYING/PRESYNC → IDLE.
  refreshPlayPauseLabel();
  // Restore the click-gate so the next session starts from the same
  // "tap Play first" affordance instead of from a bare iframe that
  // YouTube would treat as play-on-click.
  refreshYtOverlay();
  // Stop ends the session: picker, mode, and speed become editable again.
  SETTINGS_LOCKED = false;
  applySettingsLock();
  TEMPO_INDEX = 0;
  MEASURE_INDEX = 0;
  EVENT_INDEX = -1;
  MUSICAL_TIME = 0;
  LAST_PERF_TIME = 0;
  clearCursor();
  // Snap back to page 1 — Stop conceptually means "back to the top".
  if (TOTAL_PAGES > 0) showPage(0);
  if (RAF_ID) cancelAnimationFrame(RAF_ID);
  RAF_ID = null;
  updateUi(0);
}

// ── Tempo control ────────────────────────────────────────────────────────────

function applySettingsLock() {
  // Single switch that disables every settings control while music is
  // playing. Source picker and speed buttons flip in lockstep.
  const dis = SETTINGS_LOCKED;
  if (elSrcPickerBtn) elSrcPickerBtn.disabled = dis;
  if (dis) hideSourceMenu();
  // Speed buttons: when unlocked, updateTempoUi computes proper bounds
  // (min/max of active grid). When locked, force both disabled regardless.
  if (dis) {
    if (elBtnTempoDown) elBtnTempoDown.disabled = true;
    if (elBtnTempoUp)   elBtnTempoUp.disabled   = true;
  } else {
    updateTempoUi();
  }
}

function snapToGrid(f, grid) {
  // Pick the grid value closest to f.
  let best = grid[0];
  for (const g of grid) {
    if (Math.abs(g - f) < Math.abs(best - f)) best = g;
  }
  return best;
}

function setTempoFactor(f) {
  // Clamp to [TEMPO_MIN, TEMPO_MAX], then snap to the active mode's grid
  // (5% in sampled-drums, 25% in YT modes — see TEMPO_GRID_* comments).
  // In YT modes this guarantees drums and YT play at the SAME rate, so
  // there's nothing for the drift-correction loop to fight.
  let next = Math.max(TEMPO_MIN, Math.min(TEMPO_MAX, f));
  next = snapToGrid(next, activeTempoGrid());
  if (next === TEMPO_FACTOR) { updateTempoUi(); return; }
  TEMPO_FACTOR = next;
  // If a schedule is live, re-aim every still-future callback at its new
  // wall-clock target. The cursor side needs no patching — its accumulator
  // already references the same TEMPO_FACTOR each frame.
  if (SCHEDULED) rebuildAudioSchedule(MUSICAL_TIME, TEMPO_FACTOR);
  // In YT modes, TEMPO_FACTOR is already a YT-supported rate by
  // construction (snap to TEMPO_GRID_YT). No more ytRateFor() needed.
  if (ytNeeded() && YT_PLAYER && YT_READY) {
    YT_PLAYER.setPlaybackRate(TEMPO_FACTOR);
  }
  updateTempoUi();
}

function onTempoUp() {
  const grid = activeTempoGrid();
  const next = grid.find(g => g > TEMPO_FACTOR + 1e-9);
  if (next !== undefined) setTempoFactor(next);
}
function onTempoDown() {
  const grid = activeTempoGrid();
  let prev = null;
  for (const g of grid) {
    if (g < TEMPO_FACTOR - 1e-9) prev = g;
    else break;
  }
  if (prev !== null) setTempoFactor(prev);
}

function updateTempoUi() {
  if (!elTempoValue) return;  // defensive — DOM should always have it
  elTempoValue.textContent = `${Math.round(TEMPO_FACTOR * 100)}%`;
  // Bounds derive from the active grid (YT modes have 4 stops, sampled
  // mode has 20). Epsilon absorbs float-snap rounding.
  const grid = activeTempoGrid();
  elBtnTempoDown.disabled = TEMPO_FACTOR <= grid[0] + 1e-9;
  elBtnTempoUp.disabled   = TEMPO_FACTOR >= grid[grid.length - 1] - 1e-9;
  // The +/- buttons' tooltip carries the grid information now (Slower /
  // Faster). The active grid is implicit in how many +/- presses cover
  // the range; we don't need an inline hint chip taking up panel space.
}

function onKeyDown(ev) {
  // Don't intercept while a form field has focus (defensive — there are
  // no inputs in this UI today, but a future search box shouldn't break).
  const tag = ev.target && ev.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || ev.target?.isContentEditable) {
    return;
  }
  // Honour the lock: arrow keys are just keyboard accessors for the +/-
  // buttons; if those are disabled, so should these be.
  if (SETTINGS_LOCKED) return;
  if (ev.key === 'ArrowUp') {
    onTempoUp();
    ev.preventDefault();
  } else if (ev.key === 'ArrowDown') {
    onTempoDown();
    ev.preventDefault();
  }
}

// ── UI loop ──────────────────────────────────────────────────────────────────

function startUiLoop() {
  if (RAF_ID) cancelAnimationFrame(RAF_ID);
  // Baseline the perf-clock accumulator at the current wall time. The next
  // frame's dt will be one frame's worth of milliseconds — small and positive.
  LAST_PERF_TIME = performance.now() / 1000;
  const tick = () => {
    tickAccumulator();
    updateUi(MUSICAL_TIME);
    RAF_ID = requestAnimationFrame(tick);
  };
  RAF_ID = requestAnimationFrame(tick);
}

function tickAccumulator() {
  // MUSICAL_TIME tracks "how far we are into the score in musical seconds",
  // computed as the integral of (wall-clock dt × current rate factor).
  // We integrate per-frame rather than computing musical = wall × factor,
  // because that closed form only works under a constant factor — and
  // changing the factor mid-song is the whole point of this feature.
  const wall = performance.now() / 1000;
  const dWall = wall - LAST_PERF_TIME;
  LAST_PERF_TIME = wall;
  if (IS_PLAYING && dWall > 0) {
    MUSICAL_TIME += dWall * TEMPO_FACTOR;
  }
  maybeCorrectYtDrift(wall);
}

function maybeCorrectYtDrift(wall) {
  // Throttled wall-clock check (default ~500 ms). YT's own getCurrentTime
  // quantises to ~250 ms, so polling faster would just oscillate.
  if (!ytNeeded()) return;
  if (!YT_PLAYER || !YT_READY || YT_BUFFERING) return;
  if (!IS_PLAYING) return;
  if (wall - LAST_YT_DRIFT_CHECK_WALL < YT_DRIFT_CHECK_INTERVAL_SEC) return;
  LAST_YT_DRIFT_CHECK_WALL = wall;
  const expected = (SCHEDULE.youtube_offset || 0) + MUSICAL_TIME;
  let actual;
  try {
    actual = YT_PLAYER.getCurrentTime();
  } catch (_) {
    return;  // iframe not ready / cross-origin throw
  }
  if (typeof actual !== 'number' || !isFinite(actual)) return;
  if (Math.abs(expected - actual) > YT_DRIFT_THRESHOLD_SEC) {
    YT_PLAYER.seekTo(expected, true);
  }
}

function updateUi(t) {
  // End-of-playback detection — replaces v36's Transport.schedule callback
  // at total_seconds + 0.5. That fired on wall-clock; we need musical time
  // so the rate factor is honoured (at 50%, the "song" runs twice as long
  // in wall seconds and the end check needs to wait correspondingly).
  if (IS_PLAYING && t >= SCHEDULE.total_seconds + 0.5) {
    onStop();
    return;
  }

  if (MEASURE_INDEX > 0 &&
      t < SCHEDULE.measures[MEASURE_INDEX].seconds_start) {
    MEASURE_INDEX = 0;
  }
  if (TEMPO_INDEX > 0 && t < SCHEDULE.tempos[TEMPO_INDEX].seconds) {
    TEMPO_INDEX = 0;
  }
  while (MEASURE_INDEX + 1 < SCHEDULE.measures.length &&
         SCHEDULE.measures[MEASURE_INDEX + 1].seconds_start <= t) {
    MEASURE_INDEX++;
  }
  while (TEMPO_INDEX + 1 < SCHEDULE.tempos.length &&
         SCHEDULE.tempos[TEMPO_INDEX + 1].seconds <= t) {
    TEMPO_INDEX++;
  }

  const m = SCHEDULE.measures[MEASURE_INDEX];

  elBar.textContent = `Bar ${m.index} / ${SCHEDULE.measures.length}`;
  elMarker.textContent = m.marker || '—';
  elPosition.textContent =
    `${formatTime(t)} / ${formatTime(SCHEDULE.total_seconds)}`;

  const pct = SCHEDULE.total_seconds > 0
    ? Math.min(100, 100 * t / SCHEDULE.total_seconds)
    : 0;
  elProgress.style.width = `${pct}%`;

  updateCursor(t);
}

// ── YouTube sync (Milestone 6g) ──────────────────────────────────────────────

function initYouTube() {
  // The IFrame API loads asynchronously via the <script> tag in player.html.
  // window.YT may or may not be defined yet when init() runs. Either path
  // ends up calling createYtPlayer(), exactly once.
  if (window.YT && typeof window.YT.Player === 'function') {
    createYtPlayer();
    return;
  }
  // YT's API will call window.onYouTubeIframeAPIReady when ready. If another
  // script set it already, chain. (Defensive — we don't expect that today.)
  const prior = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function () {
    if (typeof prior === 'function') {
      try { prior(); } catch (_) { /* swallow */ }
    }
    createYtPlayer();
  };
}

function createYtPlayer() {
  YT_PLAYER = new YT.Player('yt', {
    videoId: SCHEDULE.youtube_id,
    playerVars: {
      playsinline: 1,         // iOS Safari: inline rather than fullscreen takeover
      controls: 0,            // drum tab is the only timeline
      modestbranding: 1,
      rel: 0,
      enablejsapi: 1,
      origin: location.origin,
    },
    events: {
      onReady: onYtReady,
      onStateChange: onYtStateChange,
    },
  });
}

function onYtReady() {
  YT_READY = true;
  // Re-cue the video at the song's start offset so the first frame the user
  // sees is the right one. CRUCIAL: use cueVideoById, NOT seekTo. Per the
  // YT IFrame API spec, seekTo(_, true) on a cued (or any non-paused)
  // player STARTS playback — that bug let the YT video autoplay the moment
  // the page loaded, before the user touched our Play button. cueVideoById
  // sets startSeconds without triggering playback.
  try {
    YT_PLAYER.cueVideoById({
      videoId: SCHEDULE.youtube_id,
      startSeconds: SCHEDULE.youtube_offset || 0,
    });
    // YT modes always want the recording audible; DRUMS never reaches
    // here because we destroy the iframe before switching to it.
    ytAudible() ? YT_PLAYER.unMute() : YT_PLAYER.mute();
  } catch (_) { /* tolerate early-state errors */ }
  maybeEnablePlay();
}

function onYtStateChange(ev) {
  // States: -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued.
  if (ev.data === 3) {
    YT_BUFFERING = true;
  } else if (ev.data === 1) {
    YT_BUFFERING = false;
    // After a buffering stall the YT clock may be far from our musical
    // clock — force a resync on the next drift check.
    LAST_YT_DRIFT_CHECK_WALL = 0;
  } else if (ev.data === 0) {
    // YT reached its end. If a session is active in ANY form — PLAYING
    // (drums still firing), PRESYNC (preroll ad somehow exceeded the
    // video, or the user idled too long), or PAUSED with YT advanced
    // off the end — snap cleanly back to IDLE. The prior IS_PLAYING
    // check left PRESYNC stuck with a dead iframe.
    if (playerState() !== STATE.IDLE) onStop();
  }
}

function refreshYtOverlay() {
  // Single source of truth for the YT click-gate's visibility. Shown iff
  // we're in a YT mode AND no session is yet committed (Stop button
  // disabled is the canonical "no session" signal). In DRUMS source the
  // iframe is destroyed entirely, so the overlay has nothing to gate.
  if (!elYtOverlay) return;
  elYtOverlay.hidden = !ytNeeded() || !elBtnStop.disabled;
}

// ── Source → YT candidate resolution ─────────────────────────────────────────
//
// Candidate selection rules match Songsterr's UI (verified via HARs):
//   - Full mix       = first feature == null (fallback: "alternative")
//   - Backing track  = first feature == "backing" whose `tracks` includes
//                      SCHEDULE.part_id (drums). Fallback to first
//                      feature:backing for caches predating the tracks field.

function fullMixCandidate() {
  const cands = SCHEDULE.youtube_candidates || [];
  return cands.find(c => c && c.feature === null)
      || cands.find(c => c && c.feature === 'alternative')
      || null;
}

function backingCandidate() {
  const cands = SCHEDULE.youtube_candidates || [];
  const partId = SCHEDULE.part_id;
  const isBacking = c => c && c.feature === 'backing';
  const matchesPart = c => c && Array.isArray(c.tracks) && c.tracks.includes(partId);
  return cands.find(c => isBacking(c) && matchesPart(c))
      || cands.find(isBacking)
      || null;
}

function candidateForSource(src) {
  if (src === SOURCE.SONG) return fullMixCandidate();
  if (src === SOURCE.BACKING) return backingCandidate();
  return null;  // DRUMS has no YT candidate
}

function isSourceAvailable(src) {
  if (src === SOURCE.DRUMS) return true;
  return candidateForSource(src) !== null;
}

function applyCandidateToSchedule(cand) {
  // Swap SCHEDULE.youtube_id + offset + per-measure anchors to the chosen
  // candidate. Each candidate has its own recording timing, so the
  // schedule has to be recomputed for the cursor to land on the right
  // beat of the new recording (not just the right starting offset).
  if (!cand) return;
  SCHEDULE.youtube_id = cand.video_id;
  if (typeof cand.offset === 'number') {
    SCHEDULE.youtube_offset = cand.offset;
  }
  if (Array.isArray(cand.points)) {
    applyPointsToSchedule(cand.points, SCHEDULE.youtube_offset);
  }
}

function applyPointsToSchedule(points, offset) {
  // Rewrite event/measure seconds from Songsterr's per-measure recording
  // anchors (one anchor per measure start in YT-video seconds). Server-side
  // build_schedule already does this for the baked-in chosen video; this
  // function handles the picker-swap case, where each candidate video has
  // its own recording timing. Returns false if the schedule shape is too
  // old to support recompute (no measure.position field) — the caller falls
  // back to leaving the existing baked timings in place.
  const measures = SCHEDULE.measures || [];
  if (!Array.isArray(points) || points.length < 2) return false;
  if (points.length > measures.length) return false;
  if (!measures.length || !Array.isArray(measures[0].position)) return false;

  const n = measures.length;
  const nPts = points.length;
  // Position + duration in whole-note units (rationals collapsed to float
  // — these are powers of 2 in the denominator so the float is exact for
  // any musically reasonable position).
  const mPos = measures.map(m => m.position[0] / m.position[1]);
  const mDur = measures.map(m => m.duration[0] / m.duration[1]);

  // Score-time = video-time − offset, so MUSICAL_TIME (which starts at 0)
  // can be compared directly with event.seconds.
  const starts = new Array(n);
  const ends = new Array(n);
  for (let i = 0; i < nPts; i++) starts[i] = points[i] - offset;
  for (let i = 0; i < nPts - 1; i++) ends[i] = points[i + 1] - offset;

  // Last anchored measure + tail (unanchored) measures: extrapolate at
  // the seconds-per-whole-note of the last anchored measure pair. Handles
  // recordings that fade out before the score's notated end.
  const lastSpw = mDur[nPts - 2] > 0
    ? (starts[nPts - 1] - starts[nPts - 2]) / mDur[nPts - 2]
    : 1.0;
  ends[nPts - 1] = starts[nPts - 1] + lastSpw * mDur[nPts - 1];
  let cursor = ends[nPts - 1];
  for (let i = nPts; i < n; i++) {
    starts[i] = cursor;
    cursor += lastSpw * mDur[i];
    ends[i] = cursor;
  }

  for (let i = 0; i < n; i++) {
    measures[i].seconds_start = starts[i];
  }

  const parsePos = s => {
    const slash = s.indexOf('/');
    return parseInt(s.slice(0, slash), 10) / parseInt(s.slice(slash + 1), 10);
  };

  // Linear scan to find the containing measure. Events are stored in
  // measure order, so a one-shot index walk is fastest; reset between
  // events to stay correct under any out-of-order edge case.
  for (const ev of SCHEDULE.events || []) {
    const p = parsePos(ev.position);
    let i = 0;
    while (i < n - 1 && p >= mPos[i] + mDur[i]) i++;
    const frac = mDur[i] > 0 ? (p - mPos[i]) / mDur[i] : 0;
    ev.seconds = starts[i] + frac * (ends[i] - starts[i]);
  }

  SCHEDULE.total_seconds = ends[n - 1];
  // tempos[].seconds isn't recomputed — TEMPO_INDEX is tracked but not
  // displayed, so stale tempo seconds have no visible effect. If we ever
  // surface the current BPM, add tempos[].position to the server schedule
  // and recompute here in the same pass.
  return true;
}

// ── Source persistence ───────────────────────────────────────────────────────

function loadSourceChoice() {
  try { return localStorage.getItem(STORAGE_KEY_SOURCE); } catch (_) { return null; }
}
function saveSourceChoice() {
  try { localStorage.setItem(STORAGE_KEY_SOURCE, CURRENT_SOURCE); } catch (_) {}
}

function defaultSource() {
  // Restore last-used source if still available for this song. Otherwise
  // default to Song when a full mix exists; fall back to Drums.
  const saved = loadSourceChoice();
  if (saved && isSourceAvailable(saved)) return saved;
  if (fullMixCandidate()) return SOURCE.SONG;
  return SOURCE.DRUMS;
}

// ── Source picker UI ─────────────────────────────────────────────────────────

// `label` is the menu row text; `chip` is the shorter text on the picker
// button itself (where vertical space is tighter and "Drums only" reads
// long next to a caret).
const SOURCE_ROWS = [
  { src: SOURCE.SONG,    label: 'Original',   chip: 'Original' },
  { src: SOURCE.BACKING, label: 'Backing',    chip: 'Backing' },
  { src: SOURCE.DRUMS,   label: 'Drums only', chip: 'Drums' },
];

function buildSourceMenu() {
  if (!elSrcPickerMenu) return;
  elSrcPickerMenu.innerHTML = '';
  for (const r of SOURCE_ROWS) {
    if (!isSourceAvailable(r.src)) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.source = r.src;
    btn.className = 'src-picker-row';
    btn.textContent = r.label;
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      setSource(r.src);
      hideSourceMenu();
    });
    elSrcPickerMenu.appendChild(btn);
  }
}

function refreshSourcePickerUi() {
  // Update the chip's label to reflect the current source.
  const labelEl = $('src-picker-label');
  if (labelEl) {
    const row = SOURCE_ROWS.find(r => r.src === CURRENT_SOURCE);
    if (row) labelEl.textContent = row.chip || row.label;
  }
  // Mark the current row as selected.
  if (elSrcPickerMenu) {
    for (const btn of elSrcPickerMenu.querySelectorAll('[data-source]')) {
      btn.classList.toggle('is-selected', btn.dataset.source === CURRENT_SOURCE);
    }
  }
  // Hide the YT slot entirely in DRUMS — the iframe has been destroyed
  // and the controls panel reclaims the horizontal space. Re-shown when
  // switching back to Original / Backing.
  if (elYtWrap) elYtWrap.hidden = (CURRENT_SOURCE === SOURCE.DRUMS);
}

function toggleSourceMenu() {
  if (!elSrcPickerMenu) return;
  if (elSrcPickerMenu.hidden) showSourceMenu();
  else hideSourceMenu();
}
function showSourceMenu() {
  if (!elSrcPickerMenu || SETTINGS_LOCKED) return;
  elSrcPickerMenu.hidden = false;
  // Defer the listener install one tick so the click that opened us
  // doesn't immediately close us.
  setTimeout(() => document.addEventListener('click', onOutsideClickSrcMenu), 0);
}
function hideSourceMenu() {
  if (!elSrcPickerMenu) return;
  elSrcPickerMenu.hidden = true;
  document.removeEventListener('click', onOutsideClickSrcMenu);
}
function onOutsideClickSrcMenu(ev) {
  if (!elSrcPickerMenu.contains(ev.target) && ev.target !== elSrcPickerBtn) {
    hideSourceMenu();
  }
}

// ── Source transitions ───────────────────────────────────────────────────────

function destroyYouTube() {
  // Tear down the YT IFrame entirely. Sidesteps the iOS AudioContext-
  // suspend gotcha — no silent iframe means no silent AudioContext to be
  // suspended for power-saving. The placeholder div takes over the slot's
  // visual space so the picker button keeps its backdrop.
  if (YT_PLAYER) {
    try { YT_PLAYER.destroy(); } catch (_) { /* tolerate transient state */ }
    YT_PLAYER = null;
  }
  YT_READY = false;
  YT_BUFFERING = false;
  // YT.Player.destroy() removes the iframe but not always the wrapper
  // element it created — recreate a fresh <div id="yt"> so the next
  // initYouTube() / new YT.Player('yt', ...) has a target to attach to.
  // Fresh div sits as the first child of .yt-wrap, before the overlay.
  const slot = $('yt');
  if (slot && slot.parentNode) {
    const fresh = document.createElement('div');
    fresh.id = 'yt';
    slot.parentNode.replaceChild(fresh, slot);
  } else if (elYtWrap) {
    const fresh = document.createElement('div');
    fresh.id = 'yt';
    elYtWrap.prepend(fresh);
  }
}

function setSource(newSource) {
  // Mid-session source switch always force-stops first — avoids orphan
  // half-states when switching out of PRESYNC or PAUSED. cueYt:false
  // because we're about to re-cue (or destroy) the iframe ourselves below.
  if (!isSourceAvailable(newSource)) return;
  if (newSource === CURRENT_SOURCE) return;
  if (playerState() !== STATE.IDLE) onStop({ cueYt: false });

  CURRENT_SOURCE = newSource;
  saveSourceChoice();

  if (MASTER_VOL) MASTER_VOL.mute = !drumsAudible();

  if (newSource === SOURCE.DRUMS) {
    destroyYouTube();
  } else {
    // YT source — point the schedule at the chosen candidate, then either
    // cue YT (if iframe still alive from a prior YT source) or recreate
    // the iframe (if we're returning from DRUMS).
    applyCandidateToSchedule(candidateForSource(newSource));
    if (!YT_PLAYER) {
      initYouTube();
    } else if (YT_READY) {
      try {
        YT_PLAYER.cueVideoById({
          videoId: SCHEDULE.youtube_id,
          startSeconds: SCHEDULE.youtube_offset || 0,
        });
        YT_PLAYER.unMute();
      } catch (_) { /* iframe transient state, harmless */ }
    }
  }

  // Source change can flip the tempo grid (fine 5% ↔ YT-locked 25%).
  // Re-snap current tempo so the displayed value is always on the
  // active grid — e.g. 85% in Drums → 75% when switching to Song.
  setTempoFactor(TEMPO_FACTOR);

  refreshSourcePickerUi();
  refreshYtOverlay();
  maybeEnablePlay();
}

// ── Formatters ───────────────────────────────────────────────────────────────

function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  const mins = Math.floor(s / 60);
  const secs = Math.floor(s % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function showError(msg) {
  elError.textContent = msg;
  console.error(msg);
}

// ── Go ───────────────────────────────────────────────────────────────────────

init();

</script>
