<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum scores</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --panel-hi: #252932;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #ffb454;
      --accent-ink: #1a1205;
      --hair: #2a2e37;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 32px 16px 64px;
    }
    .layout { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px 0; letter-spacing: -0.01em; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

    /* ── Search box ───────────────────────────────────────────── */
    .search {
      position: relative; margin-bottom: 14px;
    }
    .search svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }
    .search input {
      width: 100%; font: inherit; font-size: 16px;
      color: var(--fg); background: var(--panel);
      border: 1px solid var(--hair); border-radius: 12px;
      padding: 14px 44px 14px 42px;
      transition: border-color .12s, box-shadow .12s;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 180, 84, .15);
    }
    .search .clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      appearance: none; border: 0; background: transparent; cursor: pointer;
      color: var(--muted); font-size: 20px; line-height: 1; padding: 6px 10px;
      border-radius: 8px; display: none;
    }
    .search .clear:hover { color: var(--fg); background: var(--panel-hi); }
    .search.has-text .clear { display: block; }

    /* ── Instrument chips ─────────────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }

    /* ── View toggle (Conveyor / Teleprompter) ────────────────── */
    .viewbar { display: flex; align-items: center; gap: 10px; margin: 4px 2px 24px; }
    .viewlabel { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--hair); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg-btn {
      appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--muted); background: transparent; border: 0; border-radius: 999px;
      padding: 7px 14px; transition: background .12s, color .12s;
    }
    .seg-btn:hover:not(.on) { color: var(--fg); }
    .seg-btn.on { background: var(--accent); color: var(--accent-ink); }
    .viewbar .hint { font-size: 12px; color: var(--muted); }
    @media (max-width: 480px) { .viewbar .hint { display: none; } }
    .chip {
      appearance: none; cursor: pointer; font: inherit;
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: var(--panel); border: 1px solid var(--hair);
      border-radius: 999px; padding: 8px 14px;
      display: inline-flex; align-items: center; gap: 7px;
      transition: background .12s, color .12s, border-color .12s, opacity .12s;
    }
    .chip:hover:not(.on) { color: var(--fg); border-color: var(--muted); }
    .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .chip .count {
      font-size: 11px; font-weight: 700; border-radius: 999px;
      padding: 1px 7px; background: rgba(255,255,255,.07); color: inherit;
    }
    .chip.on .count { background: rgba(0,0,0,.16); }
    .chip.empty { opacity: .5; }

    /* ── Song list ────────────────────────────────────────────── */
    .group-head {
      display: flex; align-items: center; gap: 12px;
      color: var(--accent); font-size: 12px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      margin: 22px 2px 8px;
    }
    .group-head::after {
      content: ""; flex: 1; height: 1px; background: var(--hair);
    }
    ul.songs { list-style: none; margin: 0; padding: 0; }
    ul.songs a {
      display: flex; align-items: center; gap: 0;
      padding: 13px 16px; background: var(--panel); color: var(--fg);
      text-decoration: none; border-radius: 8px; margin-bottom: 5px;
      transition: background .1s, transform .05s;
    }
    ul.songs a:hover { background: var(--panel-hi); }
    ul.songs a:active { transform: scale(.997); }
    ul.songs .title { color: var(--fg); }
    ul.songs .title mark { background: rgba(255,180,84,.25); color: var(--fg); border-radius: 3px; padding: 0 1px; }
    ul.songs .tag {
      margin-left: 10px; font-size: 11px; font-weight: 600; color: var(--muted);
      border: 1px solid var(--hair); border-radius: 999px; padding: 1px 8px;
    }
    ul.songs .go { margin-left: auto; color: var(--muted); font-size: 13px; opacity: .7; }

    .empty-state {
      text-align: center; color: var(--muted); font-size: 14px;
      padding: 40px 16px; line-height: 1.6;
    }

    .footer { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
    .footer a { color: var(--muted); }

    /* ── Splash / "powering up" ──────────────────────────────────
       Full-screen key art on first load; auto-dismisses (~3.2s) or
       on click. Bar-fill (3s) is paired with the 3200ms timer below —
       keep them in sync if you change the duration. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 1.5rem;
      cursor: pointer;
      background:
        radial-gradient(1000px 600px at 50% 35%, #1a1018 0%, transparent 70%),
        #07060a;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-art {
      max-width: min(92vw, 920px);
      max-height: 66vh;
      width: auto;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06);
      animation: splashpop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1.1) both;
    }
    @keyframes splashpop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    .splash-msg {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      color: #f3e9d6;
      text-shadow: 0 2px 12px rgba(255, 180, 84, 0.4);
    }
    .splash-bar { width: min(70vw, 300px); height: 6px; background: rgba(255, 255, 255, 0.12); border-radius: 99px; overflow: hidden; }
    .splash-bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #bd7517); border-radius: 99px; animation: splashfill 3s ease forwards; }
    @keyframes splashfill { from { width: 0; } to { width: 100%; } }
    .splash-skip { margin: 0; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); }
    @media (prefers-reduced-motion: reduce) {
      .splash-art { animation: none; }
      .splash-bar-fill { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash" role="dialog" aria-label="Loading">
    <img src="splash.jpg" alt="A knight at a drum kit blasting a goblin back with a beam of sound" class="splash-art" />
    <p class="splash-msg">🥁 Counting in…</p>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    <p class="splash-skip">click anywhere to skip</p>
  </div>

  <div class="layout">
    <h1>Drum scores</h1>
    <div class="subtitle" id="subtitle">Engraved notation synced to YouTube, with a live cursor.</div>

    <div class="search" id="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="Search artist or title…" aria-label="Search artist or title">
      <button class="clear" id="clear" type="button" aria-label="Clear search">×</button>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Instrument"></div>

    <div class="viewbar">
      <span class="viewlabel">View</span>
      <div class="seg" id="viewseg" role="tablist" aria-label="Playback view">
        <button class="seg-btn" data-view="conveyor" role="tab">Conveyor</button>
        <button class="seg-btn" data-view="teleprompter" role="tab">Teleprompter</button>
      </div>
      <span class="hint" id="viewhint"></span>
    </div>

    <div id="list"></div>

    <div class="footer">
      Engraving: VexFlow · Audio: the song's official YouTube, beat-synced.<br>
      Looking for the old grid &amp; sheet-music views? They live in the <a href="archive/index.html">archive</a>.
    </div>
  </div>

<script src="songs.js"></script>
<script>
// Splash: show the key art for a few seconds, then reveal the app (click skips).
const splash = document.getElementById('splash');
if (splash) {
  // A random battle cry on each load — keeps the theme fresh. On-theme with the
  // key art: the knight's blast beat is what keeps the goblin off the kit.
  const SPLASH_PHRASES = [
    '🥁 Counting in…',
    '🔥 Warming up the kit…',
    '💥 Charging the blast beat…',
    '🛡️ Holding off the goblin…',
    '⚡ Powering up the backbeat…',
    '🤘 Cueing the breakdown…',
    '🪘 Tuning the toms…',
    '🎶 Setting the tempo…',
  ];
  const splashMsg = splash.querySelector('.splash-msg');
  if (splashMsg) splashMsg.textContent = SPLASH_PHRASES[Math.floor(Math.random() * SPLASH_PHRASES.length)];

  const dismissSplash = () => splash.classList.add('hide');
  const splashTimer = setTimeout(dismissSplash, 3200);  // paired with the 3s bar-fill in CSS
  splash.addEventListener('click', () => { clearTimeout(splashTimer); dismissSplash(); });
}

// window.SONGS is generated by pipeline/export_vexflow.py (see songs.js).
const SONGS = (window.SONGS || []).slice();

// Canonical instrument order for the filter row. Drums is all we have today;
// guitar/bass appear automatically once scores with those labels are exported.
const INSTRUMENTS = [
  { key: 'drums',  label: 'Drums'  },
  { key: 'guitar', label: 'Guitar' },
  { key: 'bass',   label: 'Bass'   },
];

// Playback view: the scrolling single-line "conveyor" (default) or the page-flip
// "teleprompter". Persisted so a returning student keeps their pick.
const PLAYERS = {
  conveyor:     { file: 'vexflow/conveyor.html', hint: 'One big line that scrolls past — tap the score to peek at your spot.' },
  teleprompter: { file: 'vexflow/player.html',   hint: 'Sheet-music rows with a moving cursor.' },
};
const VIEW_KEY = 'drumScores.view';
let view = localStorage.getItem(VIEW_KEY);
if (!PLAYERS[view]) view = 'conveyor';

const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const viewSegEl = document.getElementById('viewseg');
const viewHintEl = document.getElementById('viewhint');
const qEl = document.getElementById('q');
const searchEl = document.getElementById('search');
const clearEl = document.getElementById('clear');

const counts = {};
SONGS.forEach(s => { counts[s.instrument] = (counts[s.instrument] || 0) + 1; });

const KEY = 'drumScores.instrument';
let instrument = localStorage.getItem(KEY);
if (!INSTRUMENTS.some(i => i.key === instrument)) {
  // Default to the first instrument that actually has songs (drums today).
  instrument = (INSTRUMENTS.find(i => counts[i.key]) || INSTRUMENTS[0]).key;
}
let query = '';

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Wrap query matches in <mark>; input is escaped first so this is safe.
function highlight(text) {
  const safe = escapeHtml(text);
  if (!query) return safe;
  const re = new RegExp('(' + escapeReg(escapeHtml(query)) + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}

function renderChips() {
  chipsEl.innerHTML = INSTRUMENTS.map(i => {
    const n = counts[i.key] || 0;
    const cls = `chip${i.key === instrument ? ' on' : ''}${n ? '' : ' empty'}`;
    return `<button class="${cls}" role="tab" data-i="${i.key}" aria-selected="${i.key === instrument}"><span>${i.label}</span><span class="count">${n}</span></button>`;
  }).join('');
}

function renderList() {
  const q = query.trim().toLowerCase();
  const rows = SONGS.filter(s =>
    s.instrument === instrument &&
    (!q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)));

  if (!rows.length) {
    const label = (INSTRUMENTS.find(i => i.key === instrument) || {}).label || instrument;
    listEl.innerHTML = `<div class="empty-state">${
      counts[instrument]
        ? `No ${escapeHtml(label.toLowerCase())} scores match “${escapeHtml(query.trim())}”.`
        : `No ${escapeHtml(label.toLowerCase())} scores yet — coming soon.`
    }</div>`;
    return;
  }

  // Group by artist, preserving the artist→title sort the manifest already has.
  const byArtist = [];
  let cur = null;
  for (const s of rows) {
    if (!cur || cur.artist !== s.artist) { cur = { artist: s.artist, items: [] }; byArtist.push(cur); }
    cur.items.push(s);
  }
  let html = '';
  for (const g of byArtist) {
    html += `<div class="group-head">${highlight(g.artist)}</div><ul class="songs">`;
    for (const s of g.items) {
      html += `<li><a href="${PLAYERS[view].file}?song=${encodeURIComponent(s.id)}">`
           +  `<span class="title">${highlight(s.title)}</span>`
           +  (s.lyrics ? `<span class="tag">lyrics</span>` : ``)
           +  `<span class="go">›</span></a></li>`;
    }
    html += `</ul>`;
  }
  listEl.innerHTML = html;
}

function setInstrument(key) {
  instrument = key;
  localStorage.setItem(KEY, key);
  renderChips();
  renderList();
}

function renderViewSeg() {
  for (const b of viewSegEl.querySelectorAll('.seg-btn')) {
    const on = b.dataset.view === view;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  }
  viewHintEl.textContent = PLAYERS[view].hint;
}
function setView(key) {
  if (!PLAYERS[key]) return;
  view = key;
  localStorage.setItem(VIEW_KEY, key);
  renderViewSeg();
  renderList();   // re-point every song link at the chosen player
}

function render() { renderChips(); renderViewSeg(); renderList(); }

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (btn) setInstrument(btn.dataset.i);
});
viewSegEl.addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn'); if (btn) setView(btn.dataset.view);
});

qEl.addEventListener('input', () => {
  query = qEl.value;
  searchEl.classList.toggle('has-text', query.length > 0);
  renderList();
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && query) { e.preventDefault(); clearSearch(); }
  if (e.key === 'Enter') {
    const first = listEl.querySelector('ul.songs a');
    if (first) window.location.href = first.getAttribute('href');
  }
});
function clearSearch() {
  query = ''; qEl.value = ''; searchEl.classList.remove('has-text');
  renderList(); qEl.focus();
}
clearEl.addEventListener('click', clearSearch);

// "/" focuses the search box from anywhere (ignored while typing in a field).
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
});

document.getElementById('subtitle').textContent =
  `${SONGS.length} ${SONGS.length === 1 ? 'song' : 'songs'} · synced to YouTube, with a live cursor.`;

render();
</script>
</body>
</html>
